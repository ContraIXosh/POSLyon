services:
  postgres:
    image: postgres:16-alpine
    container_name: poslyon_postgres_cloud
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-poslyon_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poslyon_secret_2026}
      POSTGRES_DB: ${DB_NAME:-poslyon_cloud}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poslyon_admin} -d ${DB_NAME:-poslyon_cloud}"]
      interval: 5s
      timeout: 5s
      retries: 5
